services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mail-ms:
    build:
      context: .
      dockerfile: dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AMQP_SERVERS: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env}@rabbitmq:5672
      TEMPLATE_DIR: /usr/app/templates
    volumes:
      - ./templates:/usr/app/templates:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
